<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANNOUNCE</title>
  <script>
    // Apply saved theme BEFORE first paint (fast path; the server value
    // in app.js is the source of truth once the app boots). Dark is the
    // default when nothing is stored.
    (function () {
      try {
        var t = localStorage.getItem('sf-theme');
        if (t === 'light') {
          document.documentElement.removeAttribute('data-theme');
        } else if (t === 'high-contrast') {
          document.documentElement.setAttribute('data-theme', 'high-contrast');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=12" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <script src="vendor/leaflet/leaflet.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="nav-left-part">
<a href="#" class="brand" data-nav="feed" title="Home" aria-label="Announce home">
          <img src="logo-light.png" alt="" class="logo logo-light" />
          <img src="logo-dark.png" alt="" class="logo logo-dark" />
          <span class="wordmark">ANNOUNCE</span>
        </a>
        <nav class="main-nav">
          <a href="#" data-nav="jobs" id="nav-jobs" class="nav-link">Jobs</a>
          <a href="#" data-nav="map" id="nav-map" class="nav-link">Map</a>
          <a href="#" data-nav="messages" id="nav-messages" class="nav-link">Messages</a>
          <a href="#" data-nav="saved" id="nav-saved" class="nav-link">Saved</a>
          <a href="#" data-nav="events" id="nav-events" class="nav-link">Events</a>
        </nav>
      </div>
      <div class="actions" id="nav-right">
        <button class="icon-btn" id="nav-search-btn" data-nav="search" title="Search" aria-label="Search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
        </button>
        <button class="icon-btn hidden" id="nav-settings-btn" data-action="open-settings" title="Settings" aria-label="Settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <div id="auth-zone"></div>
      </div>
    </div>
  </header>

  <main class="shell">
    <aside class="col-left" id="col-left" aria-label="Sidebar"></aside>
    <section class="col-center">
      <div id="app"></div>
    </section>
    <aside class="col-right" id="col-right" aria-label="Community"></aside>
  </main>

  <!-- Auth modal -->
  <div class="overlay hidden" id="auth-overlay">
    <div class="modal">
      <button class="modal-close" id="auth-close">&times;</button>
      <h2 id="auth-title">Welcome back</h2>
      <p class="modal-sub" id="auth-sub">Log in to continue.</p>
      <form id="auth-form" autocomplete="on">
        <input type="text" id="auth-name" placeholder="Full name" autocomplete="name" class="hidden" />
        <input type="email" id="auth-email" placeholder="Email" autocomplete="email" required />
        <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password" required />
        <input type="text" id="auth-skills" placeholder="Skills (comma separated, e.g. Barista, Driving)" class="hidden" />
        <p class="form-error hidden" id="auth-error"></p>
        <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Log in</button>
      </form>
      <div id="auth-social"></div>
      <p class="modal-switch">
        <span id="auth-switch-text">Don't have an account?</span>
        <a href="#" id="auth-switch">Sign up</a>
      </p>
      <p class="demo-hint hidden" id="auth-demo-hint"></p>
    </div>
  </div>

  <!-- Gotcha modal (login-gated actions) -->
  <div class="overlay hidden" id="gotcha-overlay">
    <div class="modal small">
      <h2 id="gotcha-title">One more step</h2>
      <p id="gotcha-text">Create an account to unlock this.</p>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="gotcha-cancel">Not now</button>
        <button class="btn btn-primary" id="gotcha-signup">Sign up</button>
      </div>
    </div>
  </div>

  <!-- Composer/subscreen modal for reusability -->
  <div class="overlay hidden" id="sheet-overlay">
    <div class="modal wide" id="sheet-body"></div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite">
    <div class="tick">✓</div>
    <span id="toast-text"></span>
  </div>

  <script src="app.js?v=12"></script>
</body>
</html>
