name: Deploy to Railway

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Railway deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          SERVICE_ID: 84e1ac30-0dd4-4a5f-8e92-cf11afe4dd46
          ENVIRONMENT_ID: 8b183f8a-2af5-4c73-aeab-6618cfb65fd3
        run: |
          curl -fsS -X POST https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer ${RAILWAY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation($serviceId: String!, $environmentId: String!){ serviceInstanceDeployV2(serviceId: $serviceId, environmentId: $environmentId) }","variables":{"serviceId":"'"${SERVICE_ID}"'","environmentId":"'"${ENVIRONMENT_ID}"'"}}'